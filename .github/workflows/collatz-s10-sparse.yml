name: Collatz S10 sparse horizon

on:
  workflow_dispatch:

jobs:
  sparse-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run sparse cumulative displacement certificate
        working-directory: collatz/src
        run: python A0_s1_8jump_sparse_displacement_horizon_certificate.py
