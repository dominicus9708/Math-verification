name: Collatz S10 c3 horizon scan

on:
  workflow_dispatch:

jobs:
  c3-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run c3 displacement horizon scan
        working-directory: collatz/src
        run: python A0_s1_8jump_c3_displacement_horizon_scan_certificate.py
