name: Collatz S10 eta one-third prune

on:
  push:
    branches:
      - collatz-stage4-window-threshold
    paths:
      - 'collatz/src/A0_s1_8jump_four_displacement_eta_pruning_certificate.py'
      - '.github/workflows/collatz-s10-eta-third-prune.yml'
  workflow_dispatch:

jobs:
  eta-third-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run four-displacement eta pruning certificate
        working-directory: collatz/src
        run: python A0_s1_8jump_four_displacement_eta_pruning_certificate.py
