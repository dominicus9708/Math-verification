name: collatz-math234-r10-safe-horizon

on:
  push:
    paths:
      - 'collatz/src/2026_09_19_math234_r10_multisource_safe_horizon.cpp'
      - 'collatz/src/2026_09_19_math234_r10_synchronized_safe_quotient.cpp'
      - 'collatz/src/2026_09_19_math234_r10_synchronized_factor_export.py'
      - '.github/workflows/collatz-math234-r10-safe-horizon.yml'
  workflow_dispatch:

jobs:
  synchronized-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev
      - name: Build synchronized MATH-234
        run: |
          g++ -O3 -std=c++17 collatz/src/2026_09_19_math234_r10_synchronized_safe_quotient.cpp -o /tmp/math234sync
      - name: Run synchronized SAFE quotient
        run: |
          set -o pipefail
          python3 collatz/src/2026_09_19_math234_r10_synchronized_factor_export.py \
            | /tmp/math234sync 2>&1 | tee math234-sync.log
          grep -q 'PASS MATH-234 synchronized SAFE quotient' math234-sync.log
      - uses: actions/upload-artifact@v4
        with:
          name: math234-r10-synchronized-safe-quotient-log
          path: math234-sync.log
