name: Collatz S10 eta five-twelfths certificate

on:
  push:
    branches:
      - collatz-stage4-window-threshold
    paths:
      - 'collatz/src/A0_s1_8jump_five_displacement_eta_pruning_certificate.py'
      - 'collatz/src/A0_s1_8jump_cumulative_pruned_frontier_export.py'
      - '.github/workflows/collatz-s10-eta-five12-measure.yml'
  workflow_dispatch:

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run five-displacement eta pruning certificate
        working-directory: collatz/src
        run: |
          python A0_s1_8jump_five_displacement_eta_pruning_certificate.py
          python A0_s1_8jump_cumulative_pruned_frontier_export.py
