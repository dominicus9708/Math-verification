name: m45 Stage 4 necessary-language Z3 verifier

on:
  push:
    branches:
      - collatz-stage4-window-threshold
    paths:
      - 'collatz/src/m45_stage4_language_z3.py'
      - '.github/workflows/m45-stage4-language-z3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collatz-stage4-window-threshold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Z3
        run: python -m pip install z3-solver
      - name: Check necessary Stage 4 language
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python collatz/src/m45_stage4_language_z3.py --milestones 28,74,84,112 | tee /tmp/m45-stage4-language-z3.txt
      - name: Persist result
        if: always()
        run: |
          mkdir -p collatz/notes
          cp /tmp/m45-stage4-language-z3.txt collatz/notes/m45-stage4-language-z3-latest.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collatz/notes/m45-stage4-language-z3-latest.txt
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin collatz-stage4-window-threshold
          git rebase origin/collatz-stage4-window-threshold || exit 1
          git push origin HEAD:collatz-stage4-window-threshold
