name: m45 Z3 no-descent verifier

on:
  push:
    branches:
      - collatz-stage4-window-threshold
    paths:
      - 'collatz/src/m45_z3_no_descent.py'
      - '.github/workflows/m45-z3-no-descent.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Z3
        run: python -m pip install z3-solver
      - name: Check m45 milestones
        run: python collatz/src/m45_z3_no_descent.py --milestones 200,300,400,500,600
