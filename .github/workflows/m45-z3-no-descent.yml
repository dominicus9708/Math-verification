name: m45 Z3 no-descent verifier

on:
  push:
    branches:
      - collatz-stage4-window-threshold
    paths:
      - 'collatz/src/m45_z3_no_descent.py'
      - '.github/workflows/m45-z3-no-descent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collatz-stage4-window-threshold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Z3
        run: python -m pip install z3-solver
      - name: Check m45 milestones
        run: |
          set -o pipefail
          python collatz/src/m45_z3_no_descent.py --milestones 200,300,400,500,600 | tee /tmp/m45-z3-latest.txt
      - name: Persist exact result
        if: always()
        run: |
          mkdir -p collatz/notes
          cp /tmp/m45-z3-latest.txt collatz/notes/m45-z3-latest.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collatz/notes/m45-z3-latest.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record m45 Z3 no-descent workflow result'
          git push origin HEAD:collatz-stage4-window-threshold
