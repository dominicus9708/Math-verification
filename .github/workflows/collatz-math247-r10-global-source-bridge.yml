name: collatz-math247-r10-global-source-bridge

on:
  push:
    paths:
      - 'collatz/src/2026_09_19_math247_global_source_bridge_audit.py'
      - '.github/workflows/collatz-math247-r10-global-source-bridge.yml'
  workflow_dispatch:

concurrency:
  group: collatz-math247-r10-global-source-bridge
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run exact global-source bridge audit
        run: |
          python3 collatz/src/2026_09_19_math247_global_source_bridge_audit.py | tee math247.log
          grep -q 'PASS MATH-247 exact original-source bridge audit' math247.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math247-r10-global-source-bridge
          path: math247.log
