name: Collatz S10 eta half endpoint certificates

on:
  push:
    branches:
      - collatz-stage4-window-threshold
    paths:
      - 'collatz/src/A0_s1_8jump_six_displacement_eta_half_measurement.py'
      - 'collatz/src/A0_s1_8jump_six_displacement_eta_half_pruning_certificate.py'
      - '.github/workflows/collatz-s10-eta-half-measure.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute conditional eta-half endpoint arithmetic
        working-directory: collatz/src
        run: python A0_s1_8jump_six_displacement_eta_half_measurement.py
      - name: Verify formal six-displacement eta-half pruning certificate
        working-directory: collatz/src
        run: python A0_s1_8jump_six_displacement_eta_half_pruning_certificate.py
